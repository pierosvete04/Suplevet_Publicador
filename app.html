<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antena</title>
<script>try{document.documentElement.dataset.tema=localStorage.getItem("pub_tema")||"oscuro"}catch(e){}</script>
<style>
/* ---------- Tokens: misma familia visual que la Sala de edición ---------- */
:root{color-scheme:dark;
  --navy:#2b6fe6;--navy-2:#1d4ed8;--celeste:#5ee1ff;--celeste-suave:rgba(94,225,255,.12);--naranja:#3d8bff;--naranja-fuerte:#2b6fe6;
  --fondo:#04060b;--superficie:#0b111e;--superficie-2:#101829;--elevado:#152038;--texto:#edf3ff;--suave:#8494b4;--borde:#1a2740;--borde-2:#24365a;
  --ok:#4ade9b;--ok-fondo:rgba(74,222,155,.13);--mal:#ff6b7d;--mal-fondo:rgba(255,107,125,.13);--aviso:#ffb547;--aviso-fondo:rgba(255,181,71,.13);
  --info:#5ee1ff;--info-fondo:rgba(94,225,255,.12);--vidrio:rgba(4,6,11,.8);--tarjeta:linear-gradient(180deg,rgba(16,24,41,.9),rgba(11,17,30,.92));
  --sombra:0 1px 2px rgba(0,0,0,.35);--sombra-alta:0 20px 50px rgba(0,0,0,.55);--r:12px;--r-chico:8px;--anillo:0 0 0 3px rgba(61,139,255,.45);
  --f:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;--fd:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;--mono:"Cascadia Mono",Consolas,monospace;
  --tt:#EEE;--ig:#C13584;--fb:#1877F2;--yt:#E62117}
:root[data-tema="claro"]{color-scheme:light;
  --navy:#2563eb;--navy-2:#1d4ed8;--celeste:#0377b8;--celeste-suave:#e2eaf8;--naranja:#2563eb;--naranja-fuerte:#2563eb;
  --fondo:#f3f6fb;--superficie:#ffffff;--superficie-2:#eef3fb;--elevado:#e2eaf8;--texto:#0b1527;--suave:#5a6b88;--borde:#dce4f0;--borde-2:#c5d2e6;
  --ok:#15924f;--ok-fondo:#e3f5ec;--mal:#d6283f;--mal-fondo:#fce8e6;--aviso:#a35a00;--aviso-fondo:#fff3d6;--info:#0377b8;--info-fondo:#e3f1fb;
  --vidrio:rgba(255,255,255,.88);--tarjeta:#ffffff;--sombra:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--sombra-alta:0 12px 32px rgba(16,24,40,.18);--tt:#111}
:root{--bg:var(--fondo);--bg2:var(--superficie);--ink:var(--texto);--muted:var(--suave);--line:var(--borde);--line2:var(--borde-2);
  --surface:var(--superficie);--surface2:var(--superficie-2);--accent:var(--navy);--accent2:var(--celeste);--err:var(--mal);--warn:var(--aviso)}
*{box-sizing:border-box}
/* Configuración: el mismo diseño en las tres apps (menú a la izquierda, secciones a la derecha) */
.conf{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.conf-menu{position:sticky;top:120px;display:grid;gap:2px;padding:12px;border:1px solid var(--borde);border-radius:16px;background:var(--tarjeta)}
.conf-tit{display:flex;gap:10px;align-items:center;padding:4px 6px 12px;margin-bottom:6px;border-bottom:1px solid var(--borde)}
.conf-tit small{display:block;color:var(--suave);font-size:11.5px}
.conf-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--superficie-2);border:1px solid var(--borde-2);font-size:16px}
.conf-menu a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;color:var(--suave);text-decoration:none;font-weight:600;font-size:13px}
.conf-menu a:hover{background:var(--superficie-2);color:var(--texto)}
.conf-menu a.activo{background:var(--superficie-2);color:var(--texto);box-shadow:inset 3px 0 0 var(--navy)}
.conf-menu a .punto-estado{margin-left:auto}
.pill-mini{font:700 11px var(--mono);color:var(--suave)}
.punto-estado{width:8px;height:8px;border-radius:50%;background:var(--borde-2);flex:none}
.punto-estado.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}.punto-estado.warn{background:var(--aviso);box-shadow:0 0 8px var(--aviso)}
.conf-cuerpo{display:grid;gap:16px;min-width:0}
.conf-sec{scroll-margin-top:130px;margin-bottom:0}
.conf-cab{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.conf-cab>div:first-child{flex:1 1 320px}.conf-cab h2{margin:0 0 2px;font-size:16px}.conf-cab p{margin:0;font-size:12.5px;color:var(--suave)}
.estado-grande{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--superficie-2);border:1px solid var(--borde);font-size:13.5px}
.estado-grande:empty{display:none}
.estado-grande b.dato{font:600 13px var(--mono);color:var(--celeste);padding:2px 8px;border-radius:7px;background:var(--superficie);border:1px solid var(--borde-2)}
@media (max-width:860px){.conf{grid-template-columns:1fr}.conf-menu{position:static;grid-auto-flow:column;overflow-x:auto}.conf-tit{display:none}}
html,body{margin:0}
body{font:14px/1.5 var(--f);color:var(--texto);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
  background:radial-gradient(1200px 600px at 85% -10%,rgba(61,139,255,.13),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(94,225,255,.07),transparent 60%),var(--fondo);background-attachment:fixed}
*{min-width:0}
:root[data-tema="claro"] body{background:var(--fondo)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
a{color:inherit}
:focus-visible{outline:none;box-shadow:var(--anillo);border-radius:var(--r-chico)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Encabezado y menú ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--vidrio);backdrop-filter:blur(14px);border-bottom:1px solid var(--borde)}
/* La cabecera es la misma en las tres apps: sus clases (app-*) y el menú de tu cuenta vienen de cuenta.js */
.barra{padding:10px 20px 9px;max-width:1500px;margin:auto}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,#047857,#10b981 60%,#a3e635);box-shadow:0 0 18px rgba(16,185,129,.4);font:800 15px var(--fd);color:#fff}
.marca small{display:block;font-size:12px;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modo{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:99px;font:700 12px var(--f);border:1px solid transparent;cursor:pointer;white-space:nowrap}
.modo.sim{background:var(--info-fondo);color:var(--info);border-color:rgba(94,225,255,.3)}.modo.vivo{background:var(--mal-fondo);color:var(--mal);border-color:rgba(255,107,125,.35)}
.modo .punto{width:8px;height:8px;border-radius:50%;background:currentColor}
.modo.vivo .punto{animation:latido 1.6s infinite}
@keyframes latido{50%{opacity:.35}}
.redes-top{display:flex;gap:4px;align-items:center}
.redes-top button{display:inline-flex;align-items:center;background:none;border:0;padding:2px;cursor:pointer;border-radius:50%}
.redes-top button:hover{box-shadow:var(--anillo)}
nav.menu{display:flex;gap:2px;padding:0 14px;max-width:1500px;margin:auto;overflow-x:auto;scrollbar-width:none}
nav.menu button{display:inline-flex;align-items:center;gap:7px;background:none;border:0;color:var(--suave);padding:9px 12px 11px;font:600 13px var(--f);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s}
nav.menu button,.ch,.redes-top button,.est,.est-c,.tag,.red-ic{flex:none}
nav.menu button:hover{color:var(--texto)}
nav.menu button.on{color:var(--texto);border-color:#3d8bff}
nav.menu .cuenta{background:#3d8bff;color:#fff;border-radius:99px;font-size:11px;padding:0 7px;font-weight:700}
.aviso-act{background:linear-gradient(90deg,#1d4ed8,#3d8bff);color:#fff;display:none;gap:12px;align-items:center;justify-content:center;padding:8px 20px;font-size:14px}
@media (max-width:720px){.marca small,.ver,.redes-top{display:none}.barra{padding:8px 12px}}
/* pantallas medianas: las pestañas bajan de línea en vez de cortarse; en el celular se deslizan y el borde se desvanece */
@media (max-width:1100px) and (min-width:641px){nav.menu{flex-wrap:wrap;overflow:visible}}
@media (max-width:640px){nav.menu{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}}

/* ---------- Estructura ---------- */
main{padding:20px 20px 60px;max-width:1500px;margin:auto}
@media (max-width:640px){main{padding:12px 12px 60px}}
.titulo-pag{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:0 0 18px}
.titulo-pag h1{font-size:22px;margin:0;line-height:1.2}
.titulo-pag p{margin:2px 0 0;color:var(--suave);font-size:14px}
.titulo-pag .acciones{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.caja{background:var(--tarjeta);border:1px solid var(--borde);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:var(--sombra)}
.caja h3{margin:0 0 4px;font-size:15px}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.suave{color:var(--suave);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}

/* ---------- Controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 14px;border-radius:8px;border:1px solid transparent;
  font:600 14px inherit;font-family:inherit;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.prim{background:linear-gradient(180deg,#4a95ff,#2b6fe6);color:#fff}.btn.prim:hover{filter:brightness(1.08)}
.btn.acento{background:linear-gradient(180deg,#4a95ff,#2b6fe6);color:#fff;box-shadow:0 0 0 1px rgba(61,139,255,.35),0 0 24px rgba(61,139,255,.18)}.btn.acento:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);color:#04110a}
.btn.sec{background:var(--superficie);color:var(--texto);border-color:var(--borde)}.btn.sec:hover{background:var(--elevado);border-color:var(--borde-2)}
.btn.fant{background:transparent;color:var(--suave)}.btn.fant:hover{background:var(--superficie-2);color:var(--texto)}
.btn.peligro{background:transparent;color:var(--mal);border-color:var(--borde)}.btn.peligro:hover{background:var(--mal-fondo)}
.btn.chico{min-height:32px;padding:0 10px;font-size:13px}
label.campo{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--suave)}
input,select,textarea{font:inherit;font-size:14px;color:var(--texto);background:var(--superficie-2);border:1px solid var(--borde);border-radius:8px;padding:8px 10px;min-height:38px;transition:border-color .15s}
input:hover,select:hover,textarea:hover{border-color:var(--borde-2)}
input:focus,select:focus,textarea:focus{outline:none;border-color:#3d8bff;box-shadow:var(--anillo)}
textarea{width:100%;min-height:150px;resize:vertical;line-height:1.5}
.interruptor{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.interruptor input{position:absolute;opacity:0;width:1px;height:1px}
.interruptor .riel{width:40px;height:22px;border-radius:99px;background:var(--borde-2);position:relative;transition:background .2s;flex:none}
.interruptor .riel::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.interruptor input:checked+.riel{background:var(--ok)}
.interruptor input:checked+.riel::after{left:21px}
.interruptor input:focus-visible+.riel{box-shadow:var(--anillo)}

/* ---------- Etiquetas ---------- */
.chip{display:inline-flex;align-items:center;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--superficie-2);border:1px solid var(--borde);color:var(--suave)}
.chip.TOFU{background:var(--info-fondo);color:var(--info);border-color:transparent}
.chip.MOFU{background:rgba(61,139,255,.15);color:#7fb0ff;border-color:transparent}
.chip.BOFU{background:var(--aviso-fondo);color:var(--aviso);border-color:transparent}
.est{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.est::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.est.pendiente{background:var(--superficie-2);color:var(--suave)}.est.publicado,.est.listo{background:var(--ok-fondo);color:var(--ok)}
.est.simulado{background:var(--info-fondo);color:var(--info)}.est.error,.est.falta{background:var(--mal-fondo);color:var(--mal)}
.est.publicando,.est.revisar,.est.atrasado{background:var(--aviso-fondo);color:var(--aviso)}
.red-ic{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font:800 10px inherit;font-family:inherit;flex:none}
.red-ic svg{width:56%;height:56%;display:block}
.red-ic.instagram{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}.red-ic.facebook{background:#0866FF}
.red-ic.tiktok{background:#000}.red-ic.tiktok svg{filter:drop-shadow(-1px -1px 0 #25F4EE) drop-shadow(1px 1px 0 #FE2C55)}.red-ic.youtube{background:#FF0000}
.red-ic.grande{width:40px;height:40px;font-size:14px}
.red-ic.apagada{filter:grayscale(1);opacity:.45}
/* Procesos (☰ arriba): copiado del panel de la Sala de edición */
dialog.pop-notifs { position: fixed; inset: calc(var(--alto-header, 56px) + 6px) 16px auto auto; margin: 0; width: min(420px, calc(100vw - 32px)); max-height: min(640px, calc(100vh - 90px));
  padding: 0; border-radius: 16px; border: 1px solid var(--line2); background: var(--superficie); color: var(--ink); box-shadow: 0 24px 60px rgba(0,0,0,.35); display: none; overflow: hidden; }
dialog.pop-notifs[open] { display: flex; flex-direction: column; animation: pn-entra .16s ease-out; }
dialog.pop-notifs::backdrop, :root[data-tema] dialog.pop-notifs::backdrop { background: rgba(0,0,0,.04); backdrop-filter: none; -webkit-backdrop-filter: none; }
@keyframes pn-entra { from { opacity: 0; transform: translateY(-6px); } }
.pn-cab { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 14px 14px 8px 16px; }
.pn-cab h2 { margin: 0; } .pn-cab small { font-size: 12px; }
.icono-x { padding: 3px 8px; }
.pn-filtros { display: flex; gap: 4px; padding: 0 12px 10px; border-bottom: 1px solid var(--line); }
.pn-filtros button { border: 1px solid transparent; background: none; color: var(--muted); font: 600 12px var(--f); padding: 4px 10px; border-radius: 99px; cursor: pointer; }
.pn-filtros button:hover { color: var(--ink); }
.pn-filtros button[aria-selected="true"] { color: var(--ink); background: var(--surface2); border-color: var(--line2); }
.pn-filtros span { color: var(--muted); font-weight: 500; }
.lista-notifs { overflow: auto; padding: 6px 8px; display: grid; gap: 2px; flex: 1; }
.pn-dia { font: 600 10.5px var(--mono); letter-spacing: .02em; color: var(--muted); padding: 10px 8px 4px; }
.notif { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: start; padding: 9px 8px; border-radius: 10px; font-size: 13px; position: relative; }
.notif:hover { background: var(--surface2); }
.notif.ok, .notif.err { color: var(--ink); }
.notif .ni { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--surface2); border: 1px solid var(--line2); color: var(--muted); }
.notif.ok .ni { color: var(--ok); border-color: rgba(74,222,155,.45); background: rgba(74,222,155,.08); }
.notif.err .ni { color: var(--err); border-color: rgba(255,107,125,.45); background: rgba(255,107,125,.08); }
.notif .nt { min-width: 0; overflow-wrap: anywhere; line-height: 1.4; } .notif .nt small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.notif.nueva .nt { font-weight: 600; }
.notif.nueva::after { content: ""; position: absolute; left: 0; top: 50%; width: 3px; height: 60%; transform: translateY(-50%); border-radius: 3px; background: var(--accent2); }
.notif .nx { opacity: 0; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 2px 6px; border-radius: 6px; }
.notif:hover .nx, .notif .nx:focus-visible { opacity: 1; } .notif .nx:hover { color: var(--ink); background: var(--elevado); }
.pn-vacio { text-align: center; padding: 34px 16px; color: var(--muted); font-size: 13px; }
.pn-vacio span { display: block; font-size: 28px; margin-bottom: 6px; opacity: .6; }
.pn-pie { padding: 8px 12px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; }
/* Procesos: el mismo panel que Notificaciones, bajo su botón */
.notif.warn .ni { color: var(--warn); border-color: rgba(255,196,87,.45); background: rgba(255,196,87,.08); }
.notif .nm { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); font-size: 12px; margin-top: 3px; font-weight: 400; }
.pn-vivo { margin: 10px 12px 2px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line2); background: var(--surface2); display: grid; gap: 6px; font-size: 13px; }
.pn-vivo .fila { justify-content: space-between; gap: 10px; flex-wrap: nowrap; }
.pn-vivo b { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pn-vivo .msg { overflow-wrap: anywhere; line-height: 1.4; }
.pn-vivo small { color: var(--muted); font-size: 11.5px; }
.pn-vivo details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
.pn-vivo pre { margin: 6px 0 0; font: 11px/1.5 var(--mono); color: var(--muted); max-height: 180px; overflow: auto; white-space: pre-wrap; }
.pn-pie.izq { display: block; font-size: 12px; color: var(--muted); line-height: 1.6; }
.pn-pie.izq b { color: var(--ink); }
.rueda{width:16px;height:16px;flex:none;border-radius:50%;border:3px solid rgba(61,139,255,.22);border-top-color:var(--accent2);animation:girar-p .8s linear infinite}@keyframes girar-p{to{transform:rotate(360deg)}}
.pn-busca{padding:8px 12px 0}.pn-busca input{width:100%}
.log-det{margin:6px 0 0;font:11px/1.5 var(--mono);color:var(--muted);max-height:160px;overflow:auto;white-space:pre-wrap}
.notif .nt time{font:600 11px var(--mono);color:var(--muted);margin-right:6px}

/* ---------- Cola ---------- */
.herr{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.herr .busca{flex:1;min-width:240px}
.resumen{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 16px}
.filtro{border:1px solid var(--borde);background:var(--superficie);border-radius:99px;padding:5px 12px;font:600 13px inherit;font-family:inherit;color:var(--suave);cursor:pointer}
.filtro.on{background:rgba(61,139,255,.15);border-color:#3d8bff;color:var(--texto)}
.dia{display:flex;align-items:center;gap:12px;margin:26px 0 12px;flex-wrap:wrap}
.dia h2{margin:0;font-size:17px}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pieza{background:var(--superficie);border:1px solid var(--borde);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sombra);transition:box-shadow .15s,border-color .15s}
.pieza:hover{box-shadow:0 6px 16px rgba(16,24,40,.12)}
.pieza.aprob{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.prev{position:relative;aspect-ratio:9/12;background:#0B1118;cursor:pointer;overflow:hidden;border:0;padding:0;width:100%;display:block}
.prev img,.prev video{width:100%;height:100%;object-fit:cover;display:block}
.prev .sello{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap}
.prev .hora{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.65);color:#fff;font:700 12px inherit;font-family:inherit;padding:3px 8px;border-radius:99px}
.prev .jugar{position:absolute;inset:auto 0 0 0;padding:28px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:12px;text-align:left;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.prev .num{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:2px 7px;border-radius:99px}
.cuerpo{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.cod{font-weight:700;font-size:14px;word-break:break-all}
.estados{display:flex;gap:6px;flex-wrap:wrap}
.estados .r{display:inline-flex;align-items:center;gap:4px}
.estados .r .red-ic{width:20px;height:20px;font-size:9px}
.avisos{color:var(--aviso);background:var(--aviso-fondo);font-size:12px;margin:0;padding:6px 10px 6px 24px;border-radius:var(--r-chico)}
.pie{padding:10px 12px;border-top:1px solid var(--borde);display:flex;gap:6px;align-items:center}
.vacio{text-align:center;padding:48px 20px;color:var(--suave)}
.vacio svg.i{width:40px;height:40px;stroke-width:1.5;color:var(--celeste)}
.vacio h3{color:var(--texto);margin:10px 0 4px}

/* ---------- Filtros y vistas ---------- */
.filtros{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.grupo{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.grupo>span{font:600 12px var(--f);color:var(--suave);margin-right:4px}
.ch{border:1px solid var(--borde-2);background:var(--superficie-2);color:var(--suave);border-radius:99px;min-height:32px;padding:0 11px;font:600 12px var(--f);cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.ch.on{color:var(--texto);border-color:#3d8bff;background:rgba(61,139,255,.15)}
.ch .n{color:var(--suave);font-weight:400}
.ch .red-ic{width:18px;height:18px;font-size:8px}
.forma{display:inline-block;border:1.5px solid currentColor;border-radius:2px;flex:none}
.vista{display:inline-flex;background:var(--superficie-2);border:1px solid var(--borde-2);border-radius:10px;padding:3px;margin-left:auto}
.vista button{border:0;background:none;color:var(--suave);min-height:30px;padding:0 12px;border-radius:7px;font:600 12px var(--f);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.vista button.on{background:var(--elevado);color:var(--texto)}
.etq{font:600 11.5px var(--f);color:var(--celeste)}
.tag{font:600 10px var(--mono);padding:1px 6px;border-radius:5px;background:var(--superficie-2);color:var(--suave);border:1px solid var(--borde);white-space:nowrap}
.redes-mini{display:inline-flex;gap:2px}.redes-mini .red-ic{width:18px;height:18px;font-size:8px}
.sec-t{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px;flex-wrap:wrap}.sec-t h2{margin:0;font:650 15px var(--fd)}
/* rejilla de publicadas: cada pieza con su medida real */
.rej{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-items:start}
.celda{position:relative;background:var(--superficie-2);border-radius:8px;overflow:hidden;cursor:pointer;border:0;padding:0;display:block;width:100%}
.celda img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.celda:hover img{transform:scale(1.04)}
.celda .tipo{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.65);color:#fff;font:700 10px var(--f);padding:2px 6px;border-radius:5px}
.celda .med{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.65);color:#fff;font:600 10px var(--mono);padding:2px 5px;border-radius:5px}
.celda .stat{position:absolute;bottom:6px;left:6px;color:#fff;font:700 12px var(--f);text-shadow:0 1px 3px #000}
.celda .rr{position:absolute;top:6px;left:6px}.celda .rr .red-ic{width:20px;height:20px;font-size:8px}
.celda.borr{outline:2px dashed var(--aviso);outline-offset:-2px}
.celda.borr .tipo{background:var(--aviso);color:#000}
.esqueleto{background:linear-gradient(90deg,var(--superficie-2),var(--elevado),var(--superficie-2));background-size:200% 100%;animation:brillo 1.2s infinite;border-radius:8px}
@keyframes brillo{to{background-position:-200% 0}}
/* lista con vista previa fija */
.tres{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.lista{background:var(--tarjeta);border:1px solid var(--borde);border-radius:var(--r);overflow:hidden}
.fila-p{display:flex;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--borde);cursor:pointer}
.fila-p:last-child{border-bottom:0}.fila-p:hover{background:rgba(61,139,255,.05)}
.fila-p.on{background:rgba(61,139,255,.1);box-shadow:inset 3px 0 0 #3d8bff}
.mini-img{width:44px;height:64px;border-radius:6px;object-fit:cover;flex:none;background:#000}
.fila-p .c{flex:1}.fila-p .c b{font:600 12px var(--mono);color:var(--celeste)}
.fila-p .c p{margin:2px 0 0;color:var(--suave);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila-p .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.prev-fija{position:sticky;top:112px;padding:14px}
.prev-fija .tel{width:100%;max-width:270px}
.prev-fija .acc{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.prev-fija .acc .btn{flex:1}
/* tablero */
.tablero{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.col{padding:10px;scroll-snap-align:start;background:var(--tarjeta);border:1px solid var(--borde);border-radius:var(--r)}
.col h3{margin:0 0 10px;font:650 13px var(--fd);display:flex;justify-content:space-between;align-items:center}
.kan{display:flex;gap:10px;padding:8px;border:1px solid var(--borde);border-radius:10px;background:var(--superficie-2);margin-bottom:8px;cursor:pointer}
.kan:hover{border-color:#3d8bff}
.kan .t{font-size:12px;flex:1}.kan .t b{display:block;font:600 11px var(--mono);color:var(--celeste);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kan .t p{margin:4px 0;color:var(--suave);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.kan .pie-k{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
/* calendario */
.semana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.dia-c{padding:8px;background:var(--tarjeta);border:1px solid var(--borde);border-radius:var(--r);min-height:200px}
.dia-c.hoy{border-color:#3d8bff}
.dia-c h3{margin:0 0 8px;font:650 13px var(--fd);display:flex;justify-content:space-between}.dia-c h3 span{color:var(--suave);font-weight:400}
.mini{display:flex;gap:8px;align-items:center;padding:6px;border:1px solid var(--borde);border-radius:9px;background:var(--superficie-2);margin-bottom:6px;cursor:pointer}
.mini:hover{border-color:#3d8bff}.mini .mini-img{width:30px;height:46px}
.mini .t{font-size:11px;line-height:1.35;flex:1}.mini .t b{display:block;font:600 11px var(--mono);color:var(--celeste)}
.mini .t .cod{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.est-c{font:700 10px var(--f);padding:1px 6px;border-radius:99px;white-space:nowrap}
.est-c.rev{background:var(--aviso-fondo);color:var(--aviso)}.est-c.apr{background:var(--ok-fondo);color:var(--ok)}.est-c.pub{background:rgba(61,139,255,.15);color:#7fb0ff}.est-c.err{background:var(--mal-fondo);color:var(--mal)}
/* visor de publicadas (carruseles) */
.visor-velo{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;place-items:center;z-index:45;padding:16px}
.visor-velo.on{display:grid}
.visor-m{display:grid;grid-template-columns:minmax(0,1fr) 340px;width:min(880px,100%);max-height:calc(100vh - 32px);overflow:hidden;background:var(--superficie);border:1px solid var(--borde);border-radius:14px}
.visor-i{position:relative;background:#000;display:grid;place-items:center;max-height:calc(100vh - 32px)}
.visor-i img{max-width:100%;max-height:calc(100vh - 32px);object-fit:contain;display:block}
.flecha{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#000;font:800 18px var(--f);cursor:pointer}
.flecha.izq{left:10px}.flecha.der{right:10px}
.puntos{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px}
.puntos span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}.puntos span.on{background:#fff}
.visor-l{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.visor-l p{white-space:pre-line;margin:0;font-size:13px;word-break:break-word}
.met-g{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.met-g div{background:var(--superficie-2);border:1px solid var(--borde);border-radius:9px;padding:8px}.met-g b{display:block;font:700 18px var(--fd)}.met-g span{color:var(--suave);font-size:12px}
.importar{display:none}.importar.on{display:block}
@media (max-width:1180px){.semana{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}.dia-c{scroll-snap-align:start}}
@media (max-width:900px){.tres{grid-template-columns:1fr}.prev-fija{display:none}.visor-m{grid-template-columns:1fr;overflow:auto}.visor-i img{max-height:60vh}}
@media (max-width:640px){
  .rej{grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}.celda{border-radius:3px}.celda .stat{font-size:10px}.celda .med,.celda .rr{display:none}
  .vista{margin-left:0;width:100%}.vista button{flex:1;justify-content:center}
  .semana{grid-auto-flow:row;grid-auto-columns:auto;overflow:visible}
  .fila-p .meta .tag{display:none}
  .grupo{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none}
  .visor-velo{padding:0}.visor-m{max-height:100vh;height:100vh;border-radius:0}
  .titulo-pag .acciones{margin-left:0;width:100%}
}

/* ---------- Listos (desde producción) ---------- */
.rej-listos{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.filtros-l{display:grid;gap:10px;margin:0 0 16px;padding:12px 14px;border:1px solid var(--borde);border-radius:var(--r);background:var(--tarjeta)}
.fl-g{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.fl-g .bl-t{min-width:72px}.fl-ayuda{margin:0;font-size:12px}
.sala-l{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font:800 11px var(--f);color:#fff;flex:none;margin-right:4px}
.sala-l.e{background:linear-gradient(135deg,#1d4ed8,#3d8bff 55%,#5ee1ff)}.sala-l.d{background:linear-gradient(135deg,#6d28d9,#a855f7 60%,#f0abfc)}
.sec-t .sala-l{width:24px;height:24px;font-size:12px}
.origen-l{display:block;color:var(--suave);font-size:11.5px}.match-l{display:block;color:var(--info);font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.en-drive{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:4px;padding:12px;text-align:center;color:var(--suave);background:var(--superficie-2);font-size:13px;font-weight:600}.en-drive small{font-weight:400;font-size:11px}.en-drive svg{width:26px;height:26px;opacity:.7}
.listo{position:relative;border-radius:10px;overflow:hidden;background:#000;border:2px solid transparent;transition:border-color .15s,transform .1s}
.listo.on{border-color:#3d8bff;box-shadow:0 0 0 3px rgba(61,139,255,.3)}
.listo.ya{opacity:.55}
.listo-caja{all:unset;display:block;width:100%;height:100%;cursor:pointer}
.listo-caja img,.listo-caja video{width:100%;height:100%;object-fit:cover;display:block}
.listo-caja:focus-visible{box-shadow:inset var(--anillo)}
.marca-sel{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:7px;border:2px solid #fff;background:rgba(0,0,0,.35);display:grid;place-items:center;color:#fff;pointer-events:none}
.listo.on .marca-sel{background:#3d8bff;border-color:#3d8bff}
.marca-sel svg.i{width:15px;height:15px;stroke-width:3}
.listo.ya .marca-sel{display:none}
.tipo-l{position:absolute;top:8px;right:44px;background:rgba(0,0,0,.65);color:#fff;font:700 10px var(--f);padding:2px 6px;border-radius:5px}
.jugar-l{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;display:grid;place-items:center;font-size:12px}
.jugar-l:hover{background:#3d8bff}
.pie-l{position:absolute;left:0;right:0;bottom:0;padding:28px 8px 8px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;font-size:11px;display:flex;flex-direction:column;gap:3px;pointer-events:none}
.pie-l b{font:600 12px var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pie-l span{color:#c9d6ef}
.barra-l{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--vidrio);backdrop-filter:blur(14px);border-top:1px solid var(--borde-2);box-shadow:0 -10px 30px rgba(0,0,0,.35);animation:sube .2s ease}
@keyframes sube{from{transform:translateY(100%)}}
.barra-l-in{max-width:1500px;margin:auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.bl-g{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bl-t{font:600 12px var(--f);color:var(--suave);margin-right:2px}
.bl-c{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--suave)}
.bl-c input,.bl-c select,.bl-g select{min-height:32px;padding:4px 8px}
.bl-fin{margin-left:auto}
.espacio-barra{height:190px}
@media (max-width:640px){.espacio-barra{height:330px}}
@media (max-width:640px){.rej-listos{grid-template-columns:repeat(2,minmax(0,1fr))}.barra-l-in{padding:10px 12px;gap:10px;max-height:60vh;overflow:auto}.bl-g{width:100%}.bl-g:nth-child(2){flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.bl-fin{margin-left:0;flex-direction:column;align-items:stretch}.barra-l .vista button{white-space:nowrap}.bl-c input[type=date]{min-width:140px}}

/* ---------- Editor lateral ---------- */
.velo{position:fixed;inset:0;background:rgba(10,18,28,.45);z-index:40;display:none}
.velo.on{display:block}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(1060px,100%);background:var(--fondo);border-left:1px solid var(--borde);z-index:41;box-shadow:var(--sombra-alta);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease}
.panel.on{transform:none}
.panel-cab{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--vidrio);border-bottom:1px solid var(--borde)}
.panel-cab h2{margin:0;font-size:16px;word-break:break-all}
.panel-cuerpo{flex:1;overflow:auto;display:grid;grid-template-columns:340px 1fr;gap:20px;padding:20px}
@media (max-width:860px){.panel-cuerpo{grid-template-columns:1fr}}
.panel-pie{display:flex;gap:8px;align-items:center;padding:12px 20px;background:var(--vidrio);border-top:1px solid var(--borde);flex-wrap:wrap}
.tel{width:300px;max-width:100%;margin:0 auto;aspect-ratio:9/19;border-radius:34px;background:#000;padding:10px;box-shadow:var(--sombra-alta);position:relative}
.tel .pantalla{position:relative;width:100%;height:100%;border-radius:26px;overflow:hidden;background:#0B1118}
.tel video,.tel img{width:100%;height:100%;object-fit:cover;display:block}
.tel .capa{position:absolute;left:0;right:0;bottom:0;padding:40px 12px 16px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff;font-size:12px;line-height:1.4;pointer-events:none}
.tel .pantalla.video .capa{bottom:42px}
.tel .capa b{display:block;margin-bottom:3px;font-size:13px}
.tel .capa .texto{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.tel .capa .yt{font-weight:700;font-size:13px;margin-bottom:4px}
.tel .lado{position:absolute;right:8px;bottom:110px;display:flex;flex-direction:column;gap:14px;color:#fff;opacity:.9;pointer-events:none}
.tel .lado span{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18)}
.tel .marca-red{position:absolute;top:12px;left:12px;pointer-events:none}
.carr{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%}
.carr img{scroll-snap-align:start;flex:0 0 100%;object-fit:contain;background:#000}
.tabs-red{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab-red{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:99px;border:1px solid var(--borde);background:var(--superficie);cursor:pointer;font:600 13px inherit;font-family:inherit;color:var(--texto)}
.tab-red.on{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.tab-red .est{font-size:11px}
.contador{font-size:12px;color:var(--suave);text-align:right;font-variant-numeric:tabular-nums}
.contador.pasa{color:var(--mal);font-weight:700}
.err{color:var(--mal);background:var(--mal-fondo);font-size:13px;padding:8px 10px;border-radius:var(--r-chico);word-break:break-word}
.nota{color:var(--info);background:var(--info-fondo);font-size:13px;padding:8px 10px;border-radius:var(--r-chico)}

/* ---------- Conexiones ---------- */
.conex{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.red-caja{display:flex;flex-direction:column;gap:12px}
.red-caja .cab{display:flex;align-items:center;gap:12px}
.red-caja .cab h3{margin:0;font-size:16px}
.cuentas{display:flex;flex-direction:column;gap:6px}
.cuenta-f{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--borde);border-radius:8px;background:var(--superficie-2)}
.cuenta-f .nom{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.falta-l{margin:0;padding-left:18px;color:var(--mal);font-size:13px}
/* ---------- Preparación ---------- */
.prep-red{display:flex;flex-direction:column;gap:14px}
.prep-pasos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.prep-pasos li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.prep-pasos .marca{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid var(--borde);color:var(--suave)}
.prep-pasos .marca.ok{background:var(--bien,#16a34a);border-color:transparent;color:#fff}
.prep-pasos small{display:block;color:var(--suave);font-size:12px;margin-top:2px}
.prep-llaves{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.prep-vuelta{display:flex;gap:8px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--fondo2,rgba(127,127,127,.08));font-size:13px;word-break:break-all}
.prep-vuelta code{flex:1}
.prep-red details summary{cursor:pointer;font-weight:600;font-size:13px}
.prep-red details ul{margin:8px 0 0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.falta-l code{font-size:12px}

/* ---------- Tablas y métricas ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--superficie);border:1px solid var(--borde);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sombra)}
.kpi .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .t{font-size:13px;color:var(--suave)}
.tabla{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--borde);white-space:nowrap}
th{color:var(--suave);font:600 12px var(--f);background:var(--superficie-2)}
tbody tr:hover{background:var(--superficie-2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.barra-n{display:inline-block;height:6px;border-radius:3px;background:var(--celeste);vertical-align:middle;margin-left:8px}
.log{font:12.5px/1.6 "Cascadia Mono",Consolas,monospace;max-height:70vh;overflow:auto;margin:0}
.log div{padding:2px 8px;border-radius:4px;white-space:pre-wrap;word-break:break-word}
.log div.e{background:var(--mal-fondo);color:var(--mal)}.log div.s{color:var(--info)}.log div.p{color:var(--ok)}
.log time{color:var(--suave);margin-right:10px}
.lista-piezas{max-height:260px;overflow:auto;border:1px solid var(--borde);border-radius:8px;padding:6px;background:var(--superficie-2)}
.lista-piezas label{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:6px;cursor:pointer}
.lista-piezas label:hover{background:var(--superficie)}

/* ---------- Avisos y diálogos ---------- */
#toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(420px,calc(100% - 40px))}
.toast{display:flex;gap:10px;align-items:flex-start;background:#1d4ed8;color:#fff;padding:12px 14px;border-radius:10px;box-shadow:var(--sombra-alta);font-size:14px;animation:entra .2s ease}
.toast.mal{background:var(--mal)}.toast.ok{background:var(--ok)}
@keyframes entra{from{transform:translateY(8px);opacity:0}}
dialog{border:0;border-radius:14px;padding:0;width:min(460px,calc(100% - 32px));background:var(--superficie);color:var(--texto);box-shadow:var(--sombra-alta)}
dialog::backdrop{background:rgba(10,18,28,.5)}
dialog .dc{padding:20px 22px}
dialog h3{margin:0 0 8px;font-size:17px}
dialog p{margin:0;color:var(--suave);white-space:pre-line}
dialog .dp{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;background:var(--superficie-2);border-top:1px solid var(--borde)}

/* ---------- Hoy: sugerencias por cuenta ---------- */
.sug-rej{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.sug-d{padding:0;margin:0;overflow:hidden}
.sug-cab{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--borde)}
.sug-cab b{display:block;font-size:14px}.sug-cab .suave{font-size:12px}
.sug-f{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--borde)}
.sug-f.off{opacity:.45}
.sug-f .hora{font:600 12px var(--mono);color:var(--celeste);width:42px;flex:none}
.sug-f .c{flex:1}.sug-f .c b{font:600 12px var(--mono);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug-f .c p{margin:2px 0 0;font-size:12px;color:var(--suave)}.sug-f .c p.ojo{color:var(--aviso)}
.sug-f input[type=checkbox]{width:18px;height:18px;accent-color:#3d8bff;flex:none;cursor:pointer}
.sug-acc{display:flex;gap:0;flex:none}.sug-acc .btn{min-height:30px;padding:0 7px}
.sug-pie{padding:10px 14px;font-size:12px;color:var(--suave)}.sug-pie.falta{color:var(--aviso);background:var(--aviso-fondo)}
.res-s{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.res-s .chip{padding:3px 10px;font-size:12.5px}.res-s .chip b{color:var(--texto);margin-right:4px}
.aj-s{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:10px}
@media (max-width:640px){.sug-rej{grid-template-columns:1fr}.sug-f{flex-wrap:wrap}.sug-f .c{flex-basis:calc(100% - 140px)}}

<style id="bordes-comunes">
/* Bordes: una sola escala, igual en la Sala de edición, la Sala de diseño y el Publicador (si se cambia aquí, se
   cambia en las tres). 9 px las casillas para escribir o elegir y los botones · 14 px las tarjetas y cuadros ·
   16 px las ventanas · las píldoras, redondas. */
:root { --r-campo: 9px; --r-caja: 14px; --r-ventana: 16px; --r-chip: 999px; }
input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]), select:not([hidden]), textarea:not([hidden]) { border-radius: var(--r-campo); }
input[type=color] { overflow: hidden; }
input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
input[type=color]::-webkit-color-swatch { border: 0; border-radius: calc(var(--r-campo) - 3px); }
.btn { border-radius: var(--r-campo); }
.caja { border-radius: var(--r-caja); }
dialog:not(#dlgEditor) { border-radius: var(--r-ventana); }
</style>

const FORMATOS=["9:16","4:5","1:1","16:9"],RATIO={"9:16":"9/16","4:5":"4/5","1:1":"1/1","16:9":"16/9"},FORMA={"9:16":[9,16],"4:5":[11,14],"1:1":[13,13],"16:9":[16,9]};
const forma=f=>{const [w,h]=FORMA[f]||[12,12];return`<span class="forma" style="width:${w}px;height:${h}px" aria-hidden="true"></span>`};
const redesMini=l=>`<span class="redes-mini">${l.map(k=>redIc(k)).join("")}</span>`;
/* Cada pieza de la cola, con lo que piden los filtros y las vistas */
function datosCola(p){
  const act=Object.entries(p.redes).filter(([,r])=>r.activa),ks=act.map(([k])=>k);
  const est=act.some(([,r])=>REINTENTAR.includes(r.estado))?["err","Con error"]:act.length&&act.every(([,r])=>["publicado","simulado"].includes(r.estado))?["pub","Publicada"]:p.aprobado?["apr","Aprobada"]:["rev","Por revisar"];
  return{p,redes:ks,clase:p.tipo=="video"?"video":"post",fmt:p.formato||(p.tipo=="video"?"9:16":"1:1"),est,copy:act[0]?.[1].copy||""}}
function pasaF(x,porLista){return(F.red=="todas"||(porLista?x.redes.includes(F.red):x.red==F.red))&&(F.clase=="todas"||x.clase==F.clase)&&(F.fmt=="todos"||(x.fmt||x.formato)==F.fmt)}
function barraFiltros(lista,porLista,extra=""){
  const n=(k,v)=>lista.filter(x=>{const g=F[k];F[k]=v;const ok=pasaF(x,porLista);F[k]=g;return ok}).length;
  const ch=(k,v,t)=>`<button class="ch ${F[k]==v?"on":""}" aria-pressed="${F[k]==v}" onclick="F.${k}='${v}';pintar()">${t} <span class="n">${n(k,v)}</span></button>`;
  return`<div class="filtros">
   <div class="grupo"><span>Red</span>${ch("red","todas","Todas")}${Object.keys(REDES).map(k=>ch("red",k,redIc(k)+REDES[k][1])).join("")}</div>
   <div class="grupo"><span>Tipo</span>${ch("clase","todas","Todo")}${ch("clase","video","▶ Videos")}${ch("clase","post","▣ Posts y carruseles")}</div>
   <div class="grupo"><span>Formato</span>${ch("fmt","todos","Todos")}${FORMATOS.map(f=>ch("fmt",f,forma(f)+f)).join("")}</div>${extra}</div>`}

function publicadas(){

  const cab=`<div class="titulo-pag"><div><h1>Publicadas</h1><p>Lo que ya salió en tus redes, cada pieza con su medida real. Arriba, lo próximo que sale, para ver cómo queda el feed.</p></div>
   <div class="acciones"><span class="suave">${PUB?.traido?"Traído el "+esc(new Date(PUB.traido).toLocaleString("es-PE",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})):""}</span><button class="btn sec" onclick="traerPublicadas(true)" ${cargandoPub?"disabled":""}>${ic("refrescar")}${cargandoPub?"Trayendo…":"Actualizar"}</button></div></div>`;
  if(!PUB){$("#main").innerHTML=cab+`<div class="rej">${Array.from({length:12},(_,i)=>`<div class="esqueleto" style="aspect-ratio:${i%3?"9/16":"1/1"}"></div>`).join("")}</div><p class="suave" style="text-align:center">La primera vez tarda unos segundos: baja las portadas de cada red.</p>`;return}
  const todas=PUB.piezas,l=todas.filter(x=>pasaF(x));
  /* lo próximo: piezas que todavía no salen, con al menos una red y sin error */
  const base=E.cola.publicaciones.map(datosCola).filter(x=>x.redes.length&&!["pub","err"].includes(x.est[0]));
  const prox=base.filter(x=>pasaF(x,1)).sort((a,b)=>(a.p.fecha||"9").localeCompare(b.p.fecha||"9")).slice(0,6)
    .map(x=>({id:x.p.id,red:F.red!="todas"?F.red:x.redes[0],tipo:"Próxima",clase:x.clase,formato:x.fmt,fotos:x.p.archivos,met:{},
      img:x.p.portada?arc(x.p.portada):x.clase=="video"?null:arc(x.p.archivos[0]),vid:x.clase=="video"?arc(x.p.archivos[0]):null}));
  /* los números de los filtros cuentan lo publicado y lo próximo (una vez por cada red de la pieza) */
  const paraContar=[...todas,...base.flatMap(x=>x.redes.map(red=>({red,clase:x.clase,fmt:x.fmt})))];
  const sinFiltros=F.red=="todas"&&F.clase=="todas"&&F.fmt=="todos";
  const errores=Object.entries(PUB.errores||{});
  const grupos=F.clase=="todas"?[["▶ Videos",l.filter(x=>x.clase=="video")],["▣ Posts y carruseles",l.filter(x=>x.clase=="post")]]:[[F.clase=="video"?"▶ Videos":"▣ Posts y carruseles",l]];
  const vacio=prox.length&&!l.length?(todas.length?"":`<p class="suave" style="text-align:center">Todavía no hay nada publicado en tus redes conectadas.</p>`)
    :`<div class="caja vacio">${ic("buscar")}<h3>${sinFiltros||!todas.length?"Todavía no hay nada publicado":"Nada con esos filtros"}</h3><p>${todas.length?"Prueba con «Todas» en red, tipo y formato.":`Conecta tus redes en <a href="#" onclick="ir('conexiones');return false">Conexiones</a> para ver lo que ya publicaste.`}</p></div>`;
  $("#main").innerHTML=cab+barraFiltros(paraContar,false)+
   (errores.length?`<div class="err" style="margin-bottom:12px">${errores.map(([r,e])=>`<b>${esc(REDES[r]?.[1]||r)}:</b> ${esc(e)}`).join("<br>")}</div>`:"")+
   (prox.length?`<div class="sec-t"><h2>Próximas</h2><span class="etq">así entran al feed</span></div><div class="rej">${prox.map(x=>x.vid&&!x.img?
     `<button class="celda borr" style="aspect-ratio:${RATIO[x.formato]}" onclick="abrirEditor('${x.id}')"><video src="${esc(x.vid)}#t=0.5" muted preload="metadata" style="width:100%;height:100%;object-fit:cover"></video><span class="rr">${redIc(x.red)}</span><span class="tipo">Próxima</span><span class="med">${x.formato}</span></button>`:celda(x,0,1)).join("")}</div>`:"")+
   (grupos.map(([t,g])=>g.length?`<div class="sec-t"><h2>${t}</h2><span class="etq">${g.length}</span></div><div class="rej">${g.map(x=>celda(x,todas.indexOf(x))).join("")}</div>`:"").join("")||vacio);
}
let vis=null,visI=0;

/* ---------- Listos: lo que la Sala dejó en V.FINALES ---------- */
let LIS=null,cargandoLis=false;const selL=new Set();
const manana=()=>{const d=new Date(Date.now()+864e5);return fechaLocal(d)};

async function traerListos(forzar){if(cargandoLis)return;cargandoLis=true;if(tab=="listos")listos();
  try{LIS=await api("/api/listos"+(forzar?"?forzar=1":""))}catch(e){LIS=LIS||{producciones:[],carpetas:[]}}finally{cargandoLis=false;if(tab=="listos")listos();pintarMenu()}}
function nuevosListos(){return(LIS?.producciones||[]).reduce((a,p)=>a+p.piezas.filter(x=>!x.en_cola).length,0)}
/* Subir contenido: la semana (lunes a domingo, la misma cuenta que las dos salas: S03 = 19–25 oct) y de qué sala viene */
const FL={semana:null,origen:"",proyecto:""};
function semanaDeHoy(){const h=fechaLocal(new Date());return(LIS?.semanas||[]).find(x=>x.desde<=h&&h<=x.hasta)?.codigo}
const rangoSem=x=>{const f=d=>new Date(d+"T12:00").toLocaleDateString("es-PE",{day:"numeric",month:"short"}).replace(".","");return`${f(x.desde)} – ${f(x.hasta)}`};
const origenDe=prod=>prod.tipo=="diseno"?"diseno":"edicion";
function piezasVisibles(prod){return(!FL.origen||origenDe(prod)==FL.origen)&&(!FL.proyecto||prod.nombre==FL.proyecto||origenDe(prod)=="diseno")?prod.piezas.filter(x=>!FL.semana||x.semana==FL.semana):[]}

  const cab=`<div class="titulo-pag"><div><h1>Subir contenido</h1><p>Lo terminado en las dos salas: los <b>videos finales</b> de la Sala de edición (carpeta V.FINALES) y los <b>posts y carruseles</b> de la Sala de diseño (carpeta FINAL). Marca lo que quieres subir, elige las redes y cuándo, y pasa a la cola.</p>${origen?`<p class="suave" style="margin-top:4px">${origen}</p>`:""}</div>
   <div class="acciones"><button class="btn sec" onclick="traerListos(true)" ${cargandoLis?"disabled":""}>${ic("refrescar")}${cargandoLis?"Buscando…":"Buscar de nuevo"}</button></div></div>`;

  const hoyS=semanaDeHoy();

      ${FL.origen!="diseno"&&proyectos.length>1?`<select aria-label="Proyecto de la Sala de edición" onchange="FL.proyecto=this.value;listos()"><option value="">Todos los proyectos</option>${proyectos.map(p=>`<option value="${esc(p.nombre)}" ${p.nombre==FL.proyecto?"selected":""}>${esc(cap(p.nombre))} · ${enSem(p)}</option>`).join("")}</select>`:""}</div>

  for(const prod of prods){
    const nuevos=prod.piezas.filter(x=>!x.en_cola),todosSel=nuevos.length&&nuevos.every(x=>selL.has(x.ruta)),d=origenDe(prod)=="diseno";

     <div class="rej rej-listos">${prod.piezas.map(tarjetaListo).join("")}</div>`;
  }

async function nuevaCampana(){

async function guardarLlaves(red){
  const cambios={};document.querySelectorAll(`[data-red="${red}"] [data-llave]`).forEach(i=>{const v=i.value.trim();if(v)cambios[i.dataset.llave]=v});

}
async function borrarLlaves(red){
  const r=PREP.redes.find(x=>x.red==red);if(!await preguntar(`¿Borrar las llaves de ${r.nombre}?`,"Se borran de esta PC. Las cuentas que ya conectaste dejan de funcionar hasta que las vuelvas a poner.","Borrar","peligro"))return;
  PREP=await api("/api/preparacion",{cambios:Object.fromEntries(r.llaves.map(l=>[l.clave,""]))});toast("Llaves borradas","ok");sucio=false;preparacion();cargar(true);
}
async function revision(red,valor){PREP=await api("/api/preparacion",{accion:"revision",red,valor});preparacion()}
async function copiarTxt(t,b){try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement("textarea");x.value=t;document.body.append(x);x.select();document.execCommand("copy");x.remove()}b.textContent="Copiado ✓";clearTimeout(b._t);b._t=setTimeout(()=>b.textContent="Copiar",2000)}

/* ---------- Conexiones ---------- */
const QUE_CUENTA={instagram:"Cuenta",facebook:"Página",tiktok:"Cuenta",youtube:"Canal"};
const META_AYUDA="«Conectar con Facebook» trae todas las páginas que administras y el Instagram de cada una. Para sumar las de otra persona, que ella toque el botón y entre con su Facebook.";
const AYUDA={instagram:META_AYUDA+" El Instagram tiene que ser de empresa o creador y estar unido a una página.",facebook:META_AYUDA,
  tiktok:"Al conectar entras con tu TikTok. Para sumar otra cuenta, primero cierra sesión en tiktok.com y luego pulsa «Agregar cuenta».",youtube:"Al conectar, Google te deja elegir el canal. Repite para sumar otro canal."};
/* «Qué falta» en palabras (las versiones viejas del servidor mandan el nombre de la llave) */
const LLAVE_DE={META:"Meta",TIKTOK:"TikTok",GOOGLE:"YouTube",google_client_secret:"YouTube"};
const esLlave=f=>/^[A-Z_]+$|\.json$/.test(f);
function faltaTxt(l){const out=[];for(const f of l){const t=esLlave(f)?`Faltan las llaves de ${LLAVE_DE[f.split(/[_.]/)[0]]||LLAVE_DE[f.replace(".json","")]||"la red"}: ponlas en Preparación`:cap(f);if(!out.includes(t))out.push(t)}
  return out.map(t=>esc(t).replace("Preparación",`<a href="#" onclick="ir('preparacion');return false">Preparación</a>`))}
function conexiones(){
  const c=E.conexiones,cfg=E.config;
  const caja=k=>{const x=c[k],cs=x.cuentas,meta=["instagram","facebook"].includes(k),oauth=x.conectable??!x.falta.some(esLlave);const que=QUE_CUENTA[k].toLowerCase();
    const url=meta?"/conectar/meta":`/conectar/${k}`,conectar=meta?"Conectar con Facebook":`Conectar ${REDES[k][1]}`,agregar=meta?"Agregar páginas":`Agregar ${que}`;
    return `<div class="caja red-caja"><div class="cab">${redIc(k,"grande "+(x.listo?"":"apagada"))}<div style="flex:1"><h3>${REDES[k][1]}</h3><span class="est ${x.listo?"listo":"falta"}">${x.listo?"Conectado":"Falta conectar"}</span></div></div>
     ${x.falta.length?`<div><div class="suave" style="font-weight:600;margin-bottom:4px">Qué falta</div><ul class="falta-l">${faltaTxt(x.falta).map(f=>`<li>${f}</li>`).join("")}</ul></div>`:""}
     ${cs?.length?`<div class="cuentas">${cs.map(a=>`<div class="cuenta-f"><span class="nom" title="${esc(a.nombre)}">${esc(a.nombre)}</span>${a.defecto?'<span class="est simulado">Por defecto</span>':`<button class="btn fant chico" onclick="api('/api/${k}/defecto',{id:'${esc(a.id)}'}).then(cargar)" title="Usar por defecto" aria-label="Usar ${esc(a.nombre)} por defecto">${ic("estrella")}</button>`}
       <button class="btn fant chico" onclick="quitarCuenta('${k}','${esc(a.id)}','${esc(a.nombre).replace(/'/g,"")}')" aria-label="Quitar ${esc(a.nombre)}" title="Quitar">${ic("x")}</button></div>`).join("")}</div>`:""}
     <p class="suave" style="margin:0">${AYUDA[k]}</p>
     ${oauth?`<div><a class="btn ${cs?.length?"sec":"prim"}" href="${url}">${ic(cs?.length?"mas":"conexiones")}${cs?.length?agregar:conectar}</a></div>`:""}</div>`};
  $("#main").innerHTML=`<div class="titulo-pag"><div><h1>Conexiones y ajustes</h1><p>Conecta las redes una vez. Las claves se guardan en tu PC, en <code>credenciales.env</code>.</p></div></div>
  <div class="caja" style="border-color:${cfg.simular?"var(--borde)":"var(--naranja-fuerte)"}"><div class="fila"><label class="interruptor"><input type="checkbox" ${cfg.simular?"checked":""} onchange="simular(this.checked)"><span class="riel"></span>Modo simulación</label>
   <span class="suave">${cfg.simular?"Prendido: anota lo que haría, pero no sube nada ni gasta.":"<b style='color:var(--naranja-fuerte)'>Apagado: lo aprobado se sube de verdad a su hora.</b>"}</span></div></div>
  <div class="conex">${Object.keys(REDES).map(caja).join("")}</div>
  <div class="grid2">
   <div class="caja"><h3>Cómo sube a TikTok</h3><label class="campo" style="margin-top:8px">Modo<select onchange="guardarCfg({tiktok_modo:this.value})">
    <option value="borrador" ${cfg.tiktok_modo=="borrador"?"selected":""}>Borrador: llega a la bandeja del celular y tú publicas</option>
    <option value="directo" ${cfg.tiktok_modo=="directo"?"selected":""}>Directo: publica solo (necesita la app aprobada)</option></select></label>
    <p class="suave" style="margin:8px 0 0">${cfg.tiktok_modo=="directo"?"Mientras TikTok no apruebe la app, el modo directo sube en privado.":"Recomendado: así le pones el sonido de moda desde la app."}</p></div>
   <div class="caja" data-borrador><h3>Horarios de salida</h3><div class="fila" style="margin-top:8px;align-items:flex-end">
    <label class="campo" style="flex:1">Videos (separados por coma)<input id="hv" value="${esc(cfg.horarios_video.join(", "))}"></label>
    <label class="campo">Carrusel<input id="hc" value="${esc(cfg.horario_carrusel)}" style="width:90px"></label>
    <button class="btn sec" onclick="guardarCfg({horarios_video:$('#hv').value.split(',').map(s=>s.trim()).filter(Boolean),horario_carrusel:$('#hc').value.trim()})">Guardar horarios</button></div>
    <p class="suave" style="margin:8px 0 0">Las piezas aprobadas salen solas a su hora mientras el publicador esté abierto.</p></div>
  </div>
  <div class="caja" data-borrador><h3>Carpetas de producción</h3><p class="suave" style="margin:4px 0 10px">Donde la Sala deja los videos listos (cada producción con su V.FINALES). Si lo dejas vacío, se buscan solas: el Drive «EDICIÓN DE VIDEOS» y la copia de la Sala.</p>
   <div class="fila"><input id="cprod" style="flex:1;min-width:260px" placeholder="G:\\Mi unidad\\EDICIÓN DE VIDEOS (una por línea o separadas por ;)" value="${esc((cfg.carpetas_produccion||[]).join("; "))}">
   <button class="btn sec" onclick="guardarCfg({carpetas_produccion:$('#cprod').value.split(';').map(s=>s.trim()).filter(Boolean)}).then(()=>{LIS=null})">Guardar carpetas</button></div></div>
  <div class="caja fila"><div style="flex:1"><h3>Carpeta de datos</h3><code class="suave">${esc(E.datos)}</code></div>
   <button class="btn peligro" onclick="apagar()">${ic("apagar")}Apagar publicador</button></div>`;
}
async function quitarCuenta(k,id,n){if(await preguntar(`¿Quitar ${n}?`,`El publicador deja de usar ${k=="youtube"?"este canal":"esta "+QUE_CUENTA[k].toLowerCase()}. Las piezas que ya salieron no se tocan.`,"Quitar","peligro")){await api(`/api/${k}/quitar`,{id});cargar()}}
async function simular(on){
  if(!on&&!await preguntar("¿Apagar la simulación?","Desde ahora, lo aprobado se sube DE VERDAD a las redes a su hora.","Apagar simulación","acento")){pintar();return}
  await guardarCfg({simular:on})}
async function guardarCfg(c){await api("/api/config",c);sucio=false;toast("Guardado","ok");cargar()}
async function apagar(){if(await preguntar("¿Apagar el publicador?","Lo programado no saldrá hasta que lo vuelvas a abrir.","Apagar","peligro")){await api("/api/adios",{});document.body.innerHTML='<div class="vacio" style="padding-top:20vh"><h3>Publicador apagado</h3><p>Ya puedes cerrar la ventana.</p></div>'}}

/* ---------- Registro ---------- */
let filtroLog="";
function configuracion(){
  if($("#confCuenta"))return;  /* ya está dibujada: no se repinta cada 15 s */
  $("#main").innerHTML=`<div class="titulo-pag"><div><h1>Configuración</h1><p>De esta PC.</p></div></div>
  <div class="conf">
    <aside class="conf-menu" aria-label="Secciones de configuración">
      <div class="conf-tit"><span class="conf-ico">⚙</span><div><b>Configuración</b><small>De esta PC</small></div></div>
      <a href="#confCuenta" class="activo">👤 Cuenta y dispositivos <span class="punto-estado ok"></span></a>
      <a href="#" onclick="event.preventDefault();ir('conexiones')">🔌 Redes conectadas</a>
      <a href="#confAct">⟳ Actualizaciones <span class="punto-estado" id="confPAct"></span></a>
    </aside>
    <div class="conf-cuerpo">
      <section class="caja conf-sec" id="confCuenta">
        <div class="conf-cab"><div><h2>Cuenta y dispositivos</h2><p>Con qué cuenta de Google entraste, en qué PCs se abrió y cerrar sesión. Es la misma sesión de las tres apps.</p></div></div>
        <div id="cfgCuenta"></div>
      </section>
      <section class="caja conf-sec" id="confAct">
        <div class="conf-cab"><div><h2>Actualizaciones del sistema</h2><p>Versión instalada: <b>${esc(E.version||"—")}</b></p></div>
          <button class="btn sec" onclick="buscarAct()">Buscar actualizaciones</button></div>
        <div class="estado-grande" id="actResultado"></div>
      </section>
    </div>
  </div>`;
  Cuenta.pintarEn($("#cfgCuenta"));
  document.querySelectorAll(".conf-menu a[href^='#conf']").forEach(a=>a.onclick=e=>{e.preventDefault();document.querySelectorAll(".conf-menu a").forEach(x=>x.classList.toggle("activo",x===a));$(a.getAttribute("href")).scrollIntoView({behavior:"smooth",block:"start"})});
}
async function buscarAct(){
  const out=$("#actResultado");out.textContent="Buscando…";
  try{const r=await (await fetch("/api/actualizacion?forzar=1")).json();
    $("#confPAct").className="punto-estado "+(r.nueva?"warn":"ok");
    out.innerHTML=r.error?esc(r.error):r.nueva?`Hay una versión nueva: <b class="dato">${esc(r.nueva)}</b>${r.completa?` · trae cambios grandes: baja el instalador completo`:` <button class="btn chico" onclick="actualizar(event)">Actualizar ahora</button>`}`:`Tienes la última versión <b class="dato">${esc(r.actual||E.version)}</b>`;
    if(r.nueva){$("#act").style.display="flex";$("#act-txt").textContent=`Hay una versión nueva (${r.nueva}).`}
  }catch(e){out.textContent="No pude revisar las actualizaciones."}}
function registro(){
  const l=E.registro.slice().reverse().filter(x=>!filtroLog||x.toLowerCase().includes(filtroLog));
  $("#main").innerHTML=`<div class="titulo-pag"><div><h1>Registro</h1><p>Todo lo que hizo el publicador, lo más nuevo arriba.</p></div>
   <div class="acciones"><input type="search" placeholder="Filtrar (ej.: ERROR, tiktok)" value="${esc(filtroLog)}" oninput="filtroLog=this.value.toLowerCase();clearTimeout(window._l);window._l=setTimeout(()=>{registro();const i=document.querySelector('.acciones input');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)"></div></div>
  <div class="caja"><div class="log">${l.map(x=>{const m=x.match(/^(\S+ \S+)\s+(.*)$/s);const t=(m?m[2]:x).replace(/ filas en \[(.*)\]$/,(_,a)=>a?` filas (${a.replace(/'/g,"")})`:" filas");const c=/ERROR/.test(t)?"e":/SIMULACIÓN/.test(t)?"s":/^Publicado|Conectado/.test(t)?"p":"";
    return`<div class="${c}">${m?`<time>${esc(m[1])}</time>`:""}${esc(t)}</div>`}).join("")||'<span class="suave">Sin registros.</span>'}</div></div>`;
}


/* ---------- Procesos (☰ arriba): lo que está haciendo el Publicador y todo lo que hizo (registro.log) ---------- */
let pestanaProc="recientes",historialProc=null,buscaProc="";
function lineasRegistro(l){   /* «2026-10-25 09:57:23  texto» → {t, fecha, hora, texto}; las líneas sin fecha (detalle de un error) van con la anterior */
  const out=[];for(const x of l){const m=x.match(/^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}):\d{2}\s+(.*)$/s);
    if(m)out.push({fecha:m[1],hora:m[2],texto:m[3]});else if(out.length)out[out.length-1].detalle=(out[out.length-1].detalle||"")+x+"\n"}
  return out.reverse()}
function claseProc(t){return/^ERROR|ERROR /.test(t)?"err":/^(Atrasado|Revisar|Drive: no pude|Ya hay un Publicador)|sin aprobar/.test(t)?"warn":/^(Publicado|\[SIMULACIÓN\]|Conectado|Importadas|Desde producción|Sugerencias aceptadas|Aprobadas|Métricas)/.test(t)?"ok":""}
function diaProc(f){const hoy=fechaLocal(new Date()),ay=fechaLocal(new Date(Date.now()-864e5));
  return f==hoy?"Hoy":f==ay?"Ayer":cap(new Date(f+"T12:00").toLocaleDateString("es-PE",{weekday:"long",day:"numeric",month:"short"}))}
function pintarProcesos(){
  document.querySelectorAll("[data-pf]").forEach(b=>b.setAttribute("aria-selected",b.dataset.pf==pestanaProc));
  const subiendo=E?E.cola.publicaciones.flatMap(p=>Object.entries(p.redes).filter(([,r])=>r.estado=="publicando").map(([k])=>({p,k}))):[];
  $("#procActual").innerHTML=subiendo.map(({p,k})=>`<div class="pn-vivo"><b><span class="rueda" aria-hidden="true"></span>${E.config.simular?"Simulando":"Subiendo"} a ${REDES[k]?.[1]||k}</b><span class="msg">${esc(p.codigo)}</span></div>`).join("");
  let l=lineasRegistro(pestanaProc=="todo"&&historialProc?historialProc:(E?.registro||[]));
  if(pestanaProc=="errores")l=l.filter(x=>claseProc(x.texto)=="err");
  if(buscaProc)l=l.filter(x=>(x.texto+(x.detalle||"")).toLowerCase().includes(buscaProc));
  $("#procResumen").textContent=subiendo.length?`${subiendo.length} subiendo ahora`:l.length?"Nada subiendo ahora":"";
  let dia="";
  $("#procHistorial").innerHTML=l.map(x=>{const c=claseProc(x.texto),d=diaProc(x.fecha),cab=d!=dia?`<div class="pn-dia">${esc(d)}</div>`:"";dia=d;
    return cab+`<div class="notif ${c}"><span class="ni" aria-hidden="true">${{ok:"✓",err:"!",warn:"■"}[c]||"i"}</span>
      <span class="nt">${esc(x.texto.replace(/^ERROR\s*/,"Error · ").replace(/^\[SIMULACIÓN\]\s*/,"Simulado · "))}<small>${esc(x.hora)}</small>${x.detalle?`<details><summary class="suave">Ver el detalle</summary><pre class="log-det">${esc(x.detalle.slice(-1500))}</pre></details>`:""}</span><span></span></div>`}).join("")
    ||`<div class="pn-vacio"><span>☰</span>${pestanaProc=="errores"?"Ningún error. Todo bien.":"No hay procesos todavía."}<br><small>Aquí ves lo que hace el Publicador: lo que sube, lo que baja de Drive, lo que falla y a qué hora.</small></div>`;
  $("#puntoProceso").hidden=!subiendo.length;
}
function abrirProcesos(){const d=$("#dlgProcesos");if(d.open)return d.close();
  document.documentElement.style.setProperty("--alto-header",$("header.top").offsetHeight+"px");   /* el panel sale justo bajo la cabecera */pestanaProc="recientes";historialProc=null;buscaProc="";$("#procBusca").value="";d.showModal();pintarProcesos()}
$("#dlgProcesos").addEventListener("click",async e=>{const d=$("#dlgProcesos"),r=d.getBoundingClientRect();
  if(e.target===d&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom))return d.close();
  const f=e.target.closest("[data-pf]");if(f){pestanaProc=f.dataset.pf;if(pestanaProc=="todo"&&!historialProc){try{historialProc=(await api("/api/registro?n=2000")).lineas}catch(er){historialProc=[]}}pintarProcesos()}});
$("#procBusca").addEventListener("input",e=>{buscaProc=e.target.value.toLowerCase();pintarProcesos()});

/* ---------- Actualizaciones ---------- */
let infoAct=null;
async function revisarAct(){try{const r=infoAct=await (await fetch("/api/actualizacion")).json();if(r.nueva){$("#act").style.display="flex";$("#act-txt").textContent=`Hay una versión nueva (${r.nueva}).${r.completa?" Esta trae cambios grandes: baja el instalador completo.":""}`}}catch(e){}}
async function actualizar(ev){try{await Actualizar.instalar({app:"el Publicador",nueva:infoAct?.nueva,version:"/api/actualizacion?forzar=1",botones:[ev?.target,...document.querySelectorAll('[onclick="actualizar(event)"]')]})}catch(e){toast("No se pudo actualizar: "+e.message,"mal")}}

document.addEventListener("focusin",e=>{if(e.target.matches("textarea,input,select"))editando=true});
document.addEventListener("focusout",()=>{editando=!!ed});
/* lo que escribes en Preparación, Conexiones o Ajustes de Hoy y todavía no guardas: el refresco no lo borra */
let sucio=false;
["input","change"].forEach(t=>document.addEventListener(t,e=>{if(e.target.closest?.("#main [data-borrador]")&&!e.target.closest("[data-libre]"))sucio=true}));
setInterval(()=>{if(!editando&&!sucio&&tab!="pauta")cargar()},15000);
(async()=>{await Cuenta.iniciar({app:"Publicador",letra:"P",fondo:"linear-gradient(135deg,#047857,#10b981 60%,#a3e635)",lugar:$("#cuentaChip"),alVolver:()=>location.reload(),menu:menuCuenta,version:()=>E?.version,alCambiarTema:cambiarTema,
  preguntar:t=>preguntar("¿Seguro?",t),avisar:t=>toast(t,"mal")});
cargar(true);revisarAct();setInterval(revisarAct,36e5)})();
</script>
