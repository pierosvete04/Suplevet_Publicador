# Al subir un tag vX.Y.Z arma el publicador portable para Windows y publica el release:
#   PublicadorSuplevet-Instalador-vX.Y.Z.exe  -> instalación nueva (doble clic)
#   app-vX.Y.Z.zip                            -> lo que baja "Actualizar ahora" dentro del programa
#   PublicadorSuplevet-vX.Y.Z.zip             -> la carpeta portable completa
name: Release publicador

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Revisar que VERSION coincide con el tag
        shell: bash
        run: |
          test "v$(tr -d '\r\n' < VERSION)" = "${GITHUB_REF_NAME}" || { echo "VERSION no coincide con el tag ${GITHUB_REF_NAME}"; exit 1; }

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Revisar que el código compila
        shell: bash
        run: python -m compileall -q $(ls *.py | grep -v '^lanzador.py$') redes

      - name: Armar PublicadorSuplevet.exe
        shell: bash
        run: |
          # Desde una carpeta que solo tiene el lanzador, para que PyInstaller no meta el código de app/ dentro del .exe
          mkdir -p _exe && cp lanzador.py instalador/icono.ico _exe/ && cd _exe
          pyinstaller lanzador.py --icon icono.ico --distpath ../dist --noconfirm --onedir --windowed --name PublicadorSuplevet \
            --collect-all webview --collect-all clr_loader --collect-all pythonnet

      - name: Copiar el código y empaquetar
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $app = "dist/PublicadorSuplevet/app"
          New-Item -ItemType Directory -Force $app | Out-Null
          # todo el código menos el lanzador (ese va dentro del .exe): así un módulo nuevo nunca queda afuera
          Get-ChildItem *.py | Where-Object Name -ne "lanzador.py" | Copy-Item -Destination $app
          Copy-Item app.html,VERSION,LANZADOR_MINIMO,LEEME.md -Destination $app
          # si falta un módulo que importa el servidor, el release no sale
          python instalador/revisar_app.py $app
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item redes -Destination $app -Recurse
          New-Item -ItemType Directory -Force dist/PublicadorSuplevet/datos | Out-Null
          Copy-Item credenciales.ejemplo.env dist/PublicadorSuplevet/datos/credenciales.env
          Compress-Archive -Path "$app/*" -DestinationPath "app-$tag.zip"
          Compress-Archive -Path dist/PublicadorSuplevet -DestinationPath "PublicadorSuplevet-$tag.zip"
          $min = (Get-Content LANZADOR_MINIMO -Raw).Trim()
          (Get-Content NOTAS_VERSION.md -Raw) + "`n`nlanzador minimo: $min" | Set-Content notas.md -Encoding utf8

      - name: Armar el instalador (.exe)
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DVersion=$v" "/DOrigen=..\dist\PublicadorSuplevet" "instalador\PublicadorSuplevet.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            PublicadorSuplevet-Instalador-${{ github.ref_name }}.exe
            app-${{ github.ref_name }}.zip
            PublicadorSuplevet-${{ github.ref_name }}.zip
          body_path: notas.md
